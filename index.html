<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Sensi FF Advanced</title>
    <style>
        /* ==========================================================================
           1. ESTILOS CSS - INTERFACE E EFEITOS NEON
           ========================================================================== */
        :root {
            --neon-verde: #00ff66;
            --neon-cinza: #888888;
            --neon-dourado: #ffd700;
            --neon-vermelho: #ff0033;
            --bg-color: #0a0a0c;
            --panel-color: #121216;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-color);
            border: 2px solid #222;
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        h1 {
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            color: #aaa;
        }

        /* Input com digitação em Neon Verde */
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            background-color: #1a1a22;
            border: 2px solid #333;
            border-radius: 8px;
            color: var(--neon-verde) !important;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-verde);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }

        /* Radio Buttons customizados */
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        /* Esconder campo DPI por padrão */
        #campo-dpi-container {
            display: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #111, #222);
            border: 2px solid var(--neon-verde);
            border-radius: 8px;
            color: var(--neon-verde);
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(0,255,102,0.5);
            box-shadow: 0 0 10px rgba(0,255,102,0.2);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background: var(--neon-verde);
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 20px rgba(0,255,102,0.6);
        }

        /* Painel de Resultados */
        .resultado-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background-color: #0d0d11;
            border: 2px solid #222;
            display: none;
            position: relative;
        }

        /* Classes de Tema Neon Dinâmico para os resultados */
        .tema-padrao {
            border-color: var(--neon-cinza) !important;
            box-shadow: 0 0 15px rgba(136, 136, 136, 0.3);
        }
        .tema-padrao .sensi-val {
            color: #ffffff;
            text-shadow: 0 0 8px var(--neon-cinza);
        }
        .tema-padrao h3 { color: var(--neon-cinza); }

        .tema-incrivel {
            border-color: var(--neon-dourado) !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .tema-incrivel .sensi-val {
            color: var(--neon-dourado);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }
        .tema-incrivel h3 { color: var(--neon-dourado); }

        .tema-proibida {
            border-color: var(--neon-vermelho) !important;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.4);
        }
        .tema-proibida .sensi-val {
            color: var(--neon-vermelho);
            text-shadow: 0 0 8px rgba(255, 0, 51, 0.7);
        }
        .tema-proibida h3 { color: var(--neon-vermelho); }

        /* Ícone da Câmera piscante do modo PROIBIDA */
        .camera-icon {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: var(--neon-vermelho);
            animation: piscar 1s infinite alternate;
        }

        @keyframes piscar {
            from { opacity: 0.3; text-shadow: 0 0 2px var(--neon-vermelho); }
            to { opacity: 1; text-shadow: 0 0 12px var(--neon-vermelho); }
        }

        .sensi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .sensi-item {
            background-color: #16161e;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .sensi-label {
            font-size: 12px;
            color: #aaa;
            display: block;
            margin-bottom: 5px;
        }

        .sensi-val {
            font-size: 22px;
            font-weight: bold;
        }

        .info-header {
            font-size: 13px;
            color: #777;
            margin-bottom: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerador de Sensi FF</h1>
    
    <!-- ENTRADA DA MARCA -->
    <div class="form-group">
        <label for="marca">Marca do Dispositivo</label>
        <input type="text" id="marca" placeholder="Ex: Apple, Samsung, Xiaomi, Motorola...">
    </div>

    <!-- ENTRADA DO MODELO SEPARADO -->
    <div class="form-group">
        <label for="modelo">Modelo do Dispositivo</label>
        <input type="text" id="modelo" placeholder="Ex: iPhone 14 Pro, Galaxy S24, Poco F5">
    </div>

    <!-- SISTEMA DE ESCOLHA DE DPI -->
    <div class="form-group">
        <label>Configuração de DPI</label>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="dpi_opcao" value="sem" checked onclick="toggleDpi(false)"> Sem DPI
            </label>
            <label class="radio-label">
                <input type="radio" name="dpi_opcao" value="com" onclick="toggleDpi(true)"> Com DPI
            </label>
        </div>
    </div>

    <!-- CAMPO COMPLEMENTAR DE VALOR DE DPI -->
    <div class="form-group" id="campo-dpi-container">
        <label for="dpi_valor">Digite o valor da DPI</label>
        <input type="number" id="dpi_valor" placeholder="Ex: 600, 720, 800">
    </div>

    <!-- BUSCA DE INFLUENCER BASE -->
    <div class="form-group">
        <label for="influencer">Influenciador de Base</label>
        <input type="text" id="influencer" placeholder="Ex: Nobru, Thurzin, Bak, Two9">
    </div>

    <!-- MODO DE SENSI E ALTERAÇÃO DE TEMA -->
    <div class="form-group">
        <label for="modo">Modo de Sensibilidade</label>
        <select id="modo">
            <option value="padrao">Padrão</option>
            <option value="incrivel">Incrível</option>
            <option value="proibida">PROIBIDA</option>
        </select>
    </div>

    <!-- TIPO DE CONFIGURAÇÃO DE VELOCIDADE (LIMITES RECONFIGURADOS) -->
    <div class="form-group">
        <label for="tipo">Tipo de Ajuste</label>
        <select id="tipo">
            <option value="alta">Alta (150 a 200)</option>
            <option value="media">Média (120 a 180)</option>
            <option value="baixa">Baixa (100 a 160)</option>
            <option value="misturado">Misturado (Mistura tudo)</option>
        </select>
    </div>

    <button onclick="gerarSensibilidade()">Gerar Sensibilidade Única</button>

    <!-- BLOCO DE SAÍDA E EXIBIÇÃO DE RESULTADOS DOS NÚMEROS -->
    <div id="resultado" class="resultado-box">
        <div id="camera" class="camera-icon">🎥</div>
        <h3 id="res-titulo" style="margin-top: 0; text-transform: uppercase; letter-spacing: 1px;"></h3>
        <div id="res-info" class="info-header"></div>
        
        <div class="sensi-grid">
            <div class="sensi-item"><span class="sensi-label">GERAL</span><span id="v-geral" class="sensi-val">0</span></div>
            <div class="sensi-item"><span class="sensi-label">PONTO VERMELHO</span><span id="v-red" class="sensi-val">0</span></div>
            <div class="sensi-item"><span class="sensi-label">MIRA 2X</span><span id="v-2x" class="sensi-val">0</span></div>
            <div class="sensi-item"><span class="sensi-label">MIRA 4X</span><span id="v-4x" class="sensi-val">0</span></div>
            <div class="sensi-item"><span class="sensi-label">AWM</span><span id="v-awm" class="sensi-val">0</span></div>
            <div class="sensi-item"><span class="sensi-label">OLHADINHA</span><span id="v-olhada" class="sensi-val">0</span></div>
        </div>
    </div>
</div>
